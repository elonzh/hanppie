[versions]
kotlin = "2.4.10"
compose = "1.12.0"
coroutines = "1.10.2"
agp = "9.1.0"
koog = "1.2.0"
ktor = "3.3.3"
activity = "1.12.4"
lifecycle = "2.10.0"
android-test-runner = "1.7.0"
android-test-junit = "1.3.0"
espresso = "3.7.0"

[libraries]
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version = "0.9.3" }
commons-net = { module = "commons-net:commons-net", version = "3.13.0" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
koog-agents = { module = "ai.koog:agents-core", version.ref = "koog" }
koog-openai = { module = "ai.koog:prompt-executor-openai-client", version.ref = "koog" }
koog-ktor = { module = "ai.koog:http-client-ktor", version.ref = "koog" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "compose" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
java-keyring = { module = "com.github.javakeyring:java-keyring", version = "1.0.4" }
compose-test = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "android-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "android-test-runner" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-compose-test = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
