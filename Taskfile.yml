version: "3"

silent: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  sync:
    desc: Install the package and development toolchain
    cmds:
      - uv sync

  sync:lab:
    desc: Install the S1 App/Lab backend into its isolated environment
    cmds:
      - UV_PROJECT_ENVIRONMENT=.venv-lab uv sync --group lab

  run:lab:
    desc: Run a Hanppie command in the isolated App/Lab environment
    preconditions:
      - sh: test -x .venv-lab/bin/hanppie
        msg: Run `task sync:lab` first
    cmds:
      - .venv-lab/bin/hanppie {{.CLI_ARGS}}

  format:
    desc: Format Python and apply safe lint fixes
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  lint:
    desc: Check formatting and lint rules without changing files
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .

  test:
    desc: Run the offline test suite with coverage
    cmds:
      - uv run pytest

  check:
    desc: Run all required local quality gates
    cmds:
      - task: lint
      - task: test

  build:
    desc: Build source and wheel distributions
    cmds:
      - uv build

  hooks:
    desc: Install prek pre-commit and pre-push hooks
    cmds:
      - uv run prek install --hook-type pre-commit --hook-type pre-push --prepare-hooks

  prek:
    desc: Run all prek hooks against tracked files
    cmds:
      - uv run prek run --all-files --show-diff-on-failure

  sdk:status:
    desc: Inspect the volatile official-SDK patch on an ADB-connected S1
    requires:
      vars: [ADB_TARGET]
    cmds:
      - uv run hanppie sdk --target {{.ADB_TARGET}} status
