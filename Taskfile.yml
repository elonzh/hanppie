version: "3"

silent: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  sync:
    desc: Install the package and development toolchain
    cmds:
      - uv sync

  format:
    desc: Format Python and apply safe lint fixes
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  lint:
    desc: Check formatting and lint rules without changing files
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .

  test:
    desc: Run the offline test suite with coverage
    cmds:
      - uv run pytest

  check:
    desc: Run all required local quality gates
    cmds:
      - task: lint
      - task: test
      - task: kotlin:test

  kotlin:test:
    desc: Run Kotlin protocol and loopback integration tests (hardware opt-in)
    cmds:
      - '{{if eq OS "windows"}}.\gradlew.bat{{else}}./gradlew{{end}} :packages:robot-core:desktopTest :apps:desktop:desktopTest'

  desktop:run:
    desc: Run the Compose desktop application
    cmds:
      - '{{if eq OS "windows"}}.\gradlew.bat{{else}}./gradlew{{end}} :apps:desktop:run'

  android:check:
    desc: Build and lint the Android APK using the configured Android SDK
    cmds:
      - '{{if eq OS "windows"}}.\gradlew.bat{{else}}./gradlew{{end}} :apps:android:assembleDebug :apps:android:lintDebug'

  desktop:package:
    desc: Build a self-contained desktop application for the current OS
    cmds:
      - '{{if eq OS "windows"}}.\gradlew.bat{{else}}./gradlew{{end}} :apps:desktop:createDistributable'

  build:
    desc: Build source and wheel distributions
    cmds:
      - uv build

  hooks:
    desc: Install prek pre-commit and pre-push hooks
    cmds:
      - uv run prek install --hook-type pre-commit --hook-type pre-push --prepare-hooks

  prek:
    desc: Run all prek hooks against tracked files
    cmds:
      - uv run prek run --all-files --show-diff-on-failure
