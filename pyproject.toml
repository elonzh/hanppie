[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "hanppie"
version = "0.1.0"
description = "Open tooling for preserving and programming DJI RoboMaster S1 robots"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Elon Zhou" },
]
keywords = ["dji", "robomaster", "robotics", "s1", "reverse-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
  "av>=15,<19",
  "click>=8.2,<8.5",
  "faster-whisper>=1.2,<2",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "mcp>=1.12.4,<2",
  "netaddr>=1.3",
  "netifaces>=0.11",
  "numpy>=1.24",
  "onnxruntime>=1.16,<1.24",
  "opencv-python>=4.10",
  "openai>=2,<3",
  "rich>=14,<15",
  "sounddevice>=0.5,<1",
  "tomlkit>=0.13,<1",
  "typer>=0.21,<0.22",
]

[project.urls]
Homepage = "https://github.com/elonzh/hanppie"
Repository = "https://github.com/elonzh/hanppie"
Issues = "https://github.com/elonzh/hanppie/issues"

[project.scripts]
hanppie = "hanppie.cli:main"

[dependency-groups]
dev = [
  "prek>=0.4.5,<0.5",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.15.18,<0.16",
]
[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12.6,<0.13"

[tool.uv.build-backend]
module-name = ["hanppie", "robomaster"]
source-include = [
  "AGENTS.md",
  "README_EN.md",
  "Taskfile.yml",
  "docs/**",
  "prek.toml",
  "tests/**",
]

[tool.ruff]
line-length = 100
target-version = "py310"
force-exclude = true
extend-exclude = [
  "src/robomaster",
  "src/hanppie/runtime",
  "src/hanppie/resources/dji_scratch.py.txt",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]
ignore = [
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"src/hanppie/agent/*.py" = ["RUF001", "RUF002"]
"src/hanppie/cli.py" = ["RUF001", "RUF002"]
"src/hanppie/diagnosis/*.py" = ["RUF001"]
"tests/test_agent_*.py" = ["RUF001", "RUF002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=hanppie",
  "--cov-report=term-missing",
  "--cov-fail-under=70",
]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["hanppie"]
omit = [
  "src/hanppie/__main__.py",
  "src/hanppie/payloads/*",
  "src/hanppie/resources/*",
  "src/hanppie/runtime/*",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
