name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create pre-release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          lfs: true
      - name: Validate version and changelog
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: scripts/release/notes.sh "$TAG"
  ios:
    needs: validate
    uses: ./.github/workflows/ios.yml
    with:
      ref: ${{ inputs.tag_name || github.ref }}
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleRelease :androidApp:lintRelease
      - name: Prepare Android artifact
        shell: bash
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk dist/Hanppie-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hanppie-android
          path: dist/Hanppie-android.apk
          if-no-files-found: error

  build-macos:
    name: Build macOS DMG
    runs-on: macos-26
    needs: validate
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Package macOS DMG
        run: ./gradlew :packages:robot-core:desktopTest :shared:jvmTest :desktopApp:packageDmg
      - name: Prepare macOS artifact
        shell: bash
        run: |
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg dist/Hanppie-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hanppie-macos
          path: dist/Hanppie-macos.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Setup WiX Toolset for jpackage
        shell: pwsh
        run: |
          $wixDir = Get-ChildItem -Path "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory | Select-Object -First 1
          if ($wixDir) {
            Write-Host "Found WiX Toolset at $($wixDir.FullName)"
            "$($wixDir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "WiX Toolset not found in Program Files, installing via Chocolatey..."
            choco install wixtoolset -y
          }
      - name: Verify WiX in PATH
        shell: pwsh
        run: |
          Get-Command candle -ErrorAction SilentlyContinue
          Get-Command light -ErrorAction SilentlyContinue
      - name: Package Windows MSI
        shell: bash
        run: ./gradlew :desktopApp:packageMsi
      - name: Dump jpackage logs on failure
        if: failure()
        shell: bash
        run: |
          if [ -d "desktopApp/build/compose/logs/packageMsi" ]; then
            for f in desktopApp/build/compose/logs/packageMsi/*.txt; do
              echo "=== $f ==="
              cat "$f"
            done
          fi
      - name: Prepare Windows artifact
        shell: bash
        run: |
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/msi/*.msi dist/Hanppie-windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: hanppie-windows
          path: dist/Hanppie-windows.msi
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos, build-windows, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          lfs: true
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: hanppie-android
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: hanppie-macos
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: hanppie-windows
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: hanppie-ios
          path: release-assets
          merge-multiple: true
      - name: Determine Release Tag
        id: release_tag
        shell: bash
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          scripts/release/notes.sh "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
          files: release-assets/*
