name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and lint Android application
        run: ./gradlew :androidApp:assembleDebug :androidApp:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hanppie-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk

  desktop:
    name: Kotlin desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test and build desktop application
        shell: bash
        run: ./gradlew :packages:robot-core:desktopTest :shared:jvmTest :desktopApp:createDistributable

  test:
    name: Python 3.10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv build
